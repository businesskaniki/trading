services:

  #################################################
  # PostgreSQL
  #################################################

  postgres:
    image: postgres:17-alpine
    container_name: aqe_postgres
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aqe_network

  #################################################
  # Redis
  #################################################

  redis:
    image: redis:7-alpine
    container_name: aqe_redis
    restart: unless-stopped

    command: redis-server /usr/local/etc/redis/redis.conf

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - aqe_network

  #################################################
  # Backend
  #################################################

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: aqe_backend

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      "

    networks:
      - aqe_network

  #################################################
  # Frontend
  #################################################

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: aqe_frontend

    restart: unless-stopped

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    command: npm run dev -- --host 0.0.0.0

    networks:
      - aqe_network

  #################################################
  # Celery Worker
  #################################################
  # This worker runs the trading loop, so it needs to see the engine
  # and strategies packages, not just the backend app. Those two are
  # sibling folders to backend/ on disk, so they're mounted in
  # explicitly alongside it, both landing under /app so Python can
  # import them as top-level packages.

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: aqe_worker

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      PYTHONPATH: /app

    command: python -m celery -A app.core.celery:celery_app worker --loglevel=info

    volumes:
      - ./backend:/app
      - ./engine:/app/engine
      - ./strategies:/app/strategies

    networks:
      - aqe_network

  #################################################
  # Celery Beat
  #################################################
  # Beat only schedules periodic housekeeping tasks (cleanup, reports,
  # etc) - it doesn't run trading logic, so it does not need engine/
  # or strategies/ mounted. Add them later only if a scheduled task
  # actually needs to import from those packages.

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: aqe_beat

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: python -m celery -A app.core.celery:celery_app beat --loglevel=info

    volumes:
      - ./backend:/app

    networks:
      - aqe_network

  #################################################
  # Flower
  #################################################

  flower:
    image: mher/flower

    container_name: aqe_flower

    depends_on:
      - redis

    command: >
      celery
      --broker=redis://redis:6379/0
      flower

    ports:
      - "5555:5555"

    networks:
      - aqe_network

  #################################################
  # pgAdmin
  #################################################

  pgadmin:
    image: dpage/pgadmin4

    container_name: aqe_pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aqe.com
      PGADMIN_DEFAULT_PASSWORD: admin

    depends_on:
      - postgres

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - aqe_network

  #################################################
  # NGINX
  #################################################

  nginx:
    build:
      context: ./docker/nginx

    container_name: aqe_nginx

    restart: unless-stopped

    depends_on:
      - backend
      - frontend

    ports:
      - "80:80"

    networks:
      - aqe_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  aqe_network:
    driver: bridge