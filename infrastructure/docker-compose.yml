services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: athena
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
    env_file:
      - ../.env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
